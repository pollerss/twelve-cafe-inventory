<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="description" content="The Twelve Cafe Inventory — shared stock, restocking, and activity tracking for café staff.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4A3528">
  <meta name="color-scheme" content="light dark">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Twelve Inventory">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>The Twelve Cafe Inventory</title>

  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #F5F4F1;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body { min-height: 100vh; }
    #boot-screen {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #F5F4F1;
      color: #241A15;
      z-index: 9999;
      transition: opacity .18s ease;
    }
    #boot-card { text-align: center; padding: 32px; }
    #boot-mark {
      width: 96px;
      height: 96px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 22px;
      background: #fff;
      border: 1px solid #E4E1DC;
      overflow: hidden;
    }
    #boot-mark img { width: 88px; height: 88px; object-fit: contain; }
    #boot-title { font-size: 18px; font-weight: 800; }
    #boot-subtitle { margin-top: 6px; font-size: 13px; opacity: .68; }
    @media (prefers-color-scheme: dark) {
      html, body, #boot-screen { background: #171412; color: #fff; }
      #boot-mark { background: #D7A677; color: #2A1C16; }
    }
  </style>
</head>
<body>
  <div id="boot-screen" aria-live="polite">
    <div id="boot-card">
      <div id="boot-mark"><img src="icons/Icon-192.png" alt="The Twelve Cafe"></div>
      <div id="boot-title">The Twelve Cafe Inventory</div>
      <div id="boot-subtitle">Loading your shared inventory…</div>
    </div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      const boot = document.getElementById('boot-screen');
      if (!boot) return;
      boot.style.opacity = '0';
      setTimeout(() => boot.remove(), 220);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
